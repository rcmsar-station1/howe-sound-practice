/* Layout: a night chart on a TV. Header strip (sections + team scores), chart/window stage left, presenter panel right; stacks on phones. Single dark theme by design: it is a night-navigation tool. */
:root{
  color-scheme: dark;
  --ink:#07101a;          /* page */
  --water:#0b1826;        /* chart water at night */
  --land:#17241f;         /* chart land at night */
  --landedge:#2c4036;
  --rule:#22344a;
  --fg:#ebe5d4;           /* bone */
  --muted:#8e9ba6;
  --brass:#f0a83a;        /* UI accent: brass / chart amber */
  --brass-dim:#f0a83a33;
  --lr:#ff4b3e; --lg:#3ce68e; --lw:#fff3cc; --ly:#ffd23c;
  --port:#e0584d; --stbd:#3cbf80;
  --panel:#0d1a28;
  --f-display:"Sofia Sans Extra Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr;height:100%;padding-inline:16px;padding-block:10px;gap:10px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.7rem;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand span{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
nav{display:flex;flex-wrap:nowrap;gap:6px;order:3;flex:1 1 100%;min-width:0;overflow-x:auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{flex:none;white-space:nowrap}
.teams{margin-left:auto}
nav button{background:transparent;border:1px solid var(--rule);border-radius:999px;padding:5px 12px;font-size:.85rem;color:var(--muted);display:flex;gap:6px;align-items:center}
nav button i{font-style:normal;font-family:var(--f-mono);font-size:.7rem;opacity:.7}
nav button[aria-current="true"]{color:var(--ink);background:var(--brass);border-color:var(--brass)}
.teams{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.team{display:flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:10px;padding:3px 4px 3px 10px}
.team .nm{font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:1.05rem}
.team.port .nm{color:var(--port)} .team.stbd .nm{color:var(--stbd)}
.team .sc{font-family:var(--f-mono);font-weight:600;font-size:1.3rem;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.team button{background:var(--panel);border:1px solid var(--rule);border-radius:7px;width:28px;height:28px;line-height:1;font-weight:700}
.newgroup{background:transparent;border:1px dashed var(--rule);border-radius:10px;padding:6px 10px;font-size:.8rem;color:var(--muted)}
.newgroup.arm{border-color:var(--brass);color:var(--brass)}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);gap:14px;min-height:0}
.stage{position:relative;background:var(--water);isolation:isolate;border:1px solid var(--rule);border-radius:14px;overflow:hidden;min-height:0;display:flex;align-items:center;justify-content:center}
.stage > svg{width:100%;height:100%;display:block;overflow:visible}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-height:0;overflow:auto}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}
h1,h2{font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:.95;margin:0;text-wrap:balance}
h1{font-size:clamp(2.4rem,4.4vw,4rem)}
h2{font-size:clamp(1.8rem,3vw,2.6rem)}
p{margin:0}
.lead{font-size:1.15rem}
.muted{color:var(--muted)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btn{background:var(--brass);color:var(--ink);border:0;border-radius:10px;padding:10px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--rule)}
.btn.sm{padding:6px 11px;font-size:.85rem}
.answer{border:1px solid var(--rule);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.answer .big{font-family:var(--f-display);font-weight:800;font-size:2.3rem;line-height:1;text-transform:uppercase}
.char{font-family:var(--f-mono);font-weight:600;font-size:1.25rem;letter-spacing:.02em}
.award{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.award button{border-radius:9px;padding:7px 12px;border:1px solid var(--rule);background:transparent;font-weight:700}
.award .p{color:var(--port)} .award .s{color:var(--stbd)}
.counter{font-family:var(--f-mono);color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
details.notes{border-top:1px solid var(--rule);padding-top:10px;margin-top:auto}
details.notes summary{cursor:pointer;font-family:var(--f-mono);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
details.notes ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:.92rem}
.flag{font-size:.82rem;color:var(--ly);border-left:2px solid var(--ly);padding-left:8px}
.keys{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
kbd{font-family:var(--f-mono);border:1px solid var(--rule);border-radius:4px;padding:0 4px}
/* map */
.land{fill:var(--land);stroke:var(--landedge);stroke-width:.8}
.dusk .land{fill:#263a30;stroke:#3f5a4a}
.dusk .wbg{fill:#10283c}
.wbg{fill:var(--water)}
.hl{fill:var(--brass);stroke:#ffd79a;stroke-width:1.2}
.ring{fill:none;stroke:var(--brass);stroke-width:2.2}
.pulse{animation:pulse 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:1;transform:scale(.6)}100%{opacity:0;transform:scale(2.2)}}
.route{fill:none;stroke:var(--brass);stroke-width:2;stroke-dasharray:6 6;opacity:.75}
.route.draw{stroke-dasharray:2000;stroke-dashoffset:2000;animation:draw 9s linear forwards;opacity:.9}
@keyframes draw{to{stroke-dashoffset:0}}
.lamp{opacity:.09;transition:opacity 60ms linear}
.lamp.on{opacity:1}
.lname{font-family:var(--f-body);font-weight:700;font-size:11px;fill:var(--fg);paint-order:stroke;stroke:var(--ink);stroke-width:3px}
.lname .c{fill:#b9c4cc;font-family:var(--f-mono);font-weight:500}
.iname{font-family:var(--f-display);font-weight:800;font-size:18px;fill:var(--fg);text-transform:uppercase;paint-order:stroke;stroke:var(--ink);stroke-width:4px;letter-spacing:.03em}
.boat{fill:var(--fg);stroke:var(--ink);stroke-width:1.5}
.dimmed .lamp:not(.target){opacity:.04}
.dimmed .lamp.on:not(.target){opacity:.35}
.zoom{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:4px;z-index:2}
.zoom button{width:38px;height:38px;border-radius:10px;background:#07101add;border:1px solid var(--rule);color:var(--fg);font-size:1.2rem;font-weight:700}
.zmap{touch-action:none;cursor:grab}
.zmap:active{cursor:grabbing}
.overlay{position:absolute;left:16px;top:14px;right:16px;display:flex;justify-content:space-between;gap:10px;pointer-events:none;flex-wrap:wrap}
.chip{pointer-events:auto;font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;background:#07101acc;border:1px solid var(--rule);border-radius:999px;padding:5px 11px;color:var(--muted)}
.chip b{color:var(--fg);font-weight:600}
.viewtog{pointer-events:auto;display:flex;gap:4px}
.viewtog button{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;background:#07101acc;border:1px solid var(--rule);border-radius:999px;padding:5px 11px;color:var(--muted)}
.viewtog button[aria-pressed="true"]{color:var(--ink);background:var(--brass);border-color:var(--brass)}
/* decoder */
.decoder{width:100%;height:100%;overflow:auto;padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;align-content:start;background:var(--ink)}
.card{border:1px solid var(--rule);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--water);cursor:pointer;text-align:left}
.card[aria-pressed="true"]{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
.card .top{display:flex;align-items:center;gap:14px}
.card .code{font-family:var(--f-mono);font-weight:600;font-size:1.35rem}
.card .what{font-size:.92rem;color:var(--muted)}
.bulb{width:34px;height:34px;flex:none}
.tl{width:100%;height:22px}
.tl .seg{fill:currentColor}
.tl .bg{fill:#ffffff10}
.tl .ph{fill:var(--brass)}
.fam{grid-column:1/-1;border-top:1px solid var(--rule);padding-top:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.fam h3{grid-column:1/-1;margin:0;font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:1.4rem}
.famrow{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.famrow .char{font-size:1rem}
.famrow span{font-size:.9rem;color:var(--muted)}
/* practice */
.choices{display:grid;grid-template-columns:1fr;gap:8px}
.choices button{text-align:left;background:transparent;border:1px solid var(--rule);border-radius:10px;padding:11px 13px;font-weight:700}
.choices button.right{border-color:var(--lg);color:var(--lg)}
.choices button.wrong{border-color:var(--lr);color:var(--lr)}
.seg2{display:flex;gap:4px;flex-wrap:wrap}
.seg2 button{background:transparent;border:1px solid var(--rule);border-radius:999px;padding:5px 12px;font-size:.85rem;color:var(--muted)}
.seg2 button[aria-pressed="true"]{color:var(--ink);background:var(--brass);border-color:var(--brass)}
.board{display:flex;flex-direction:column;gap:6px}
.board div{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.9rem;border-bottom:1px solid var(--rule);padding-block:4px;font-variant-numeric:tabular-nums}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.hero{padding:28px;display:flex;flex-direction:column;gap:12px;max-width:62ch}
.wrapgrid{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
@media (max-width:900px){
  main{grid-template-columns:1fr;grid-template-rows:minmax(320px,58vh) auto}
  .app{height:auto;min-height:100%}
  .brand b{font-size:1.4rem}
}
@media (prefers-reduced-motion:reduce){.pulse,.route.draw{animation:none}.route.draw{stroke-dashoffset:0}}

.modes{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;flex:1 1 100%;order:3}
.modes::-webkit-scrollbar{display:none}
.modes button{flex:none;background:transparent;border:1px solid var(--rule);border-radius:999px;padding:7px 14px;font-size:.9rem;color:var(--muted)}
.modes button[aria-pressed="true"]{color:var(--ink);background:var(--brass);border-color:var(--brass)}
.hdr-new{margin-left:auto;background:transparent;border:1px solid var(--rule);border-radius:10px;padding:7px 12px;font-size:.85rem;color:var(--fg)}
.progress{display:flex;gap:4px}
.progress i{flex:1;height:5px;border-radius:3px;background:var(--rule)}
.progress i.cur{background:var(--brass)} .progress i.ok{background:var(--stbd)} .progress i.no{background:var(--port)}
.choices button{display:flex;gap:10px;align-items:center;font-size:1rem}
.choices kbd{font-size:.7rem;color:var(--muted)}
.choices button:not([disabled]):hover{border-color:var(--brass)}
.feedback{border-radius:10px;padding:10px 12px;border:1px solid var(--rule)}
.feedback.good{border-color:var(--stbd)} .feedback.bad{border-color:var(--port)}
.feedback .char{font-size:1rem}
.final{display:flex;align-items:baseline;gap:8px}
.final .big{font-family:var(--f-display);font-weight:800;font-size:5rem;line-height:.9;color:var(--brass)}
.final .of{font-family:var(--f-mono);font-size:1.4rem;color:var(--muted)}
.missed{display:flex;flex-direction:column;gap:4px}
.missed div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--rule);padding-block:5px;font-size:.92rem}
.missed b{font-family:var(--f-mono);font-weight:600;text-align:right}
.foot{font-size:.8rem;margin-top:auto}
.flashstage{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(circle at 50% 45%,#0d1c2c,#03070c);padding:16px}
.bigbulb{width:min(60vh,80%);max-width:100%;height:auto}
.tlwrap{width:min(420px,90%);display:flex;flex-direction:column;gap:6px;font-family:var(--f-mono);font-size:.85rem;color:var(--muted);text-align:center}
@media (max-width:900px){main{grid-template-rows:minmax(300px,52vh) auto}}
@media (max-width:600px){.brand span{display:none}}
</style>

    }}
  if(o.boat){const[x,y,h]=o.boat;s+=`<g transform="translate(${x} ${y}) rotate(${h})"><path class="boat" d="M0,-11 L6,6 L0,3 L-6,6 Z"/></g>`}
  if(o.target&&o.reveal){const L=LBY[o.target];s+=`<circle class="ring" cx="${L.x}" cy="${L.y}" r="13"/><text class="iname" x="${L.x}" y="${L.y-20}" text-anchor="middle" font-size="15">${L.n}</text>`}
  return s+'</svg>'}
function hex(c){return{R:'#ff4b3e',G:'#3ce68e',W:'#fff3cc',Y:'#ffd23c'}[c]}
function zoomBox(x,y,w){const r=GEO.VW/GEO.VH, h=w/r*1.0;let X=x-w/2,Y=y-h/2;X=Math.max(-40,Math.min(GEO.VW-w+40,X));Y=Math.max(-40,Math.min(GEO.VH-h+40,Y));return[X,Y,w,h]}

function zoomUI(){const st=$('stage');const svg=st.querySelector('svg.zmap');if(!svg)return;
  if(!st.querySelector('.zoom')){const z=document.createElement('div');z.className='zoom';
    z.innerHTML='<button data-z="in" aria-label="Zoom in">+</button><button data-z="out" aria-label="Zoom out">−</button><button data-z="reset" aria-label="Reset zoom">⟲</button>';st.appendChild(z)}}
function getVB(svg){return svg.getAttribute('viewBox').split(' ').map(Number)}
function setVB(svg,v){svg.setAttribute('viewBox',v.map(n=>n.toFixed(1)).join(' '));S.zoom=v;S.zoomKey=viewKey()}
function zoomAt(svg,f,cx,cy){const v=getVB(svg),v0=svg.dataset.vb0.split(' ').map(Number);
  let w=Math.min(v0[2]*1.2,Math.max(v0[2]/8,v[2]*f)),h=w*v[3]/v[2];
  const r=svg.getBoundingClientRect(),m=svg.getScreenCTM();
  let px=v[0]+v[2]/2,py=v[1]+v[3]/2;
  if(cx!=null&&m){const p=new DOMPoint(cx,cy).matrixTransform(m.inverse());px=p.x;py=p.y}
  const nx=px-(px-v[0])*(w/v[2]),ny=py-(py-v[1])*(h/v[3]);setVB(svg,[nx,ny,w,h])}
document.addEventListener('wheel',e=>{const svg=e.target.closest&&e.target.closest('svg.zmap');if(!svg)return;e.preventDefault();zoomAt(svg,e.deltaY>0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
const ptrs=new Map();let pinch0=null;
document.addEventListener('pointerdown',e=>{const svg=e.target.closest&&e.target.closest('svg.zmap');if(!svg)return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,svg});svg.setPointerCapture&&svg.setPointerCapture(e.pointerId);if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y)}});
document.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const svg=p.svg;
  if(ptrs.size===2&&pinch0){const prev={...p};p.x=e.clientX;p.y=e.clientY;const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(d>0){zoomAt(svg,pinch0/d,(a.x+b.x)/2,(a.y+b.y)/2);pinch0=d}return}
  const m=svg.getScreenCTM();if(!m)return;const v=getVB(svg);const dx=(e.clientX-p.x)/m.a,dy=(e.clientY-p.y)/m.d;p.x=e.clientX;p.y=e.clientY;setVB(svg,[v[0]-dx,v[1]-dy,v[2],v[3]])});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=null}));
document.addEventListener('click',e=>{const b=e.target.closest('[data-z]');if(!b)return;const svg=$('stage').querySelector('svg.zmap');if(!svg)return;
  if(b.dataset.z==='reset'){svg.setAttribute('viewBox',svg.dataset.vb0);S.zoom=null}else zoomAt(svg,b.dataset.z==='in'?1/1.4:1.4)});

function bulb(s,c){return `<svg class="bulb" viewBox="0 0 34 34"><circle cx="17" cy="17" r="15" fill="#ffffff08"/><g class="lamp" data-s="${s}"><circle cx="17" cy="17" r="16" fill="url(#gd${c})"/><circle cx="17" cy="17" r="5" fill="${hex(c)}"/></g></svg>`}
function timeline(k,c){const s=SEQ[k],per=s.reduce((a,b)=>a+b,0);let x=0,r='';s.forEach((d,i)=>{if(i%2===0)r+=`<rect class="seg" x="${x/per*100}%" y="3" width="${Math.max(.8,d/per*100)}%" height="16" rx="2"/>`;x+=d});
  return `<svg class="tl" style="color:${hex(c)}" aria-label="${per} second cycle"><rect class="bg" x="0" y="3" width="100%" height="16" rx="3"/>${r}<rect class="ph" data-ph="${k}" x="0" y="0" width="2" height="22"/></svg>`}

/* ---------- practice tool ---------- */
const $=id=>document.getElementById(id);
const S={zoom:null,zoomKey:null};
const VER=LIGHTS.filter(l=>!l.unv);
const BAYS=GEO.bays;
const CHARS=[...new Set(VER.map(l=>l.ch))];
const PER_ROUND=10;
const MODES=[['mixed','Mixed'],['lights','Lights'],['islands','Islands'],['bays','Bays & coves']];
let Q={mode:'mixed',round:[],i:0,score:0,picked:null,missed:[],best:{}};
try{const b=JSON.parse(localStorage.getItem('hu_best')||'{}');if(b&&typeof b==='object')Q.best=b}catch(e){}
try{const m=localStorage.getItem('hu_mode');if(MODES.some(x=>x[0]===m))Q.mode=m}catch(e){}
function viewKey(){return Q.mode+'|'+Q.i+'|'+Q.round.length}
function pick(arr,n){return shuffle(arr).slice(0,n)}
function opts(right,pool){return shuffle([right,...pick(pool.filter(x=>x!==right),3)])}

function lightQ(L,type){
  if(type==='name') return {k:'lightName',L,prompt:'Which light flashes here?',ans:L.n,opts:opts(L.n,VER.map(x=>x.n))};
  if(type==='char') return {k:'lightChar',L,prompt:`What is ${L.n}${/s$/.test(L.n)?"'":"'s"} characteristic?`,sub:'Watch the flash, then choose.',ans:L.ch,opts:opts(L.ch,CHARS)};
  // flash only: no map, no name. Distractors share the colour where possible so it is about the pattern.
  const others=CHARS.filter(c=>c!==L.ch), col=' '+L.c+' ', pat=L.ch.split(' ')[0];
  const same=shuffle(others.filter(c=>c.includes(col))), samePat=shuffle(others.filter(c=>!c.includes(col)&&c.split(' ')[0]===pat)), rest=shuffle(others.filter(c=>!c.includes(col)&&c.split(' ')[0]!==pat));
  return {k:'flash',L,prompt:'What characteristic is this light showing?',sub:'Count the flashes and time the full cycle.',ans:L.ch,opts:shuffle([L.ch,...[...same,...samePat,...rest].slice(0,3)])};
}
function islandQ(I){return {k:'island',I,prompt:'Name this island',ans:I.name,opts:opts(I.name,ISL.map(x=>x.name))}}
function bayQ(B){return {k:'bay',I:B,prompt:'Name this bay or cove',ans:B.name,opts:opts(B.name,BAYS.map(x=>x.name))}}
function lightRound(n){const types=['name','char','flash'];return pick(VER,n).map((L,i)=>lightQ(L,types[(i+Math.floor(Math.random()*3))%3]))}
function newRound(){
  let r;
  if(Q.mode==='lights') r=lightRound(PER_ROUND);
  else if(Q.mode==='islands') r=pick(ISL,PER_ROUND).map(islandQ);
  else if(Q.mode==='bays') r=pick(BAYS,PER_ROUND).map(bayQ);
  else r=shuffle([...lightRound(4),...pick(ISL,3).map(islandQ),...pick(BAYS,3).map(bayQ)]);
  Q.round=r;Q.i=0;Q.score=0;Q.picked=null;Q.missed=[];S.zoom=null;LIGHTS.forEach(L=>L.phase=Math.random()*12);render();
}
function stageFor(q){
  if(q.k==='island') return mapSVG({cls:'dusk',vb:zoomBox(q.I.x,q.I.y,430),hlPoly:q.I.poly,ring:[q.I.x,q.I.y],ringR:q.I.poly!=null?14:9,lights:false,label:q.picked?[q.I.x,q.I.y,q.I.name]:null});
  if(q.k==='bay') return mapSVG({cls:'dusk',vb:zoomBox(q.I.x,q.I.y,330),ring:[q.I.x,q.I.y],ringR:8,lights:false,label:q.picked?[q.I.x,q.I.y,q.I.name]:null});
  if(q.k==='flash'){const L=q.L;return `<div class="flashstage"><svg viewBox="0 0 300 300" class="bigbulb" aria-label="Flashing light"><defs><radialGradient id="bb${L.c}"><stop offset="0" stop-color="${hex(L.c)}"/><stop offset=".25" stop-color="${hex(L.c)}" stop-opacity=".55"/><stop offset="1" stop-color="${hex(L.c)}" stop-opacity="0"/></radialGradient></defs><g class="lamp" data-s="${L.s}"><circle cx="150" cy="150" r="140" fill="url(#bb${L.c})"/><circle cx="150" cy="150" r="22" fill="${hex(L.c)}"/></g><circle cx="150" cy="150" r="9" fill="${hex(L.c)}" opacity=".3"/></svg>${q.picked?`<div class="tlwrap">${timeline(L.s,L.c)}<span>${L.ch} · e.g. ${L.n}</span></div>`:''}</div>`}
  return mapSVG({vb:zoomBox(q.L.x,q.L.y,380),only:[q.L.id],target:q.L.id,reveal:!!q.picked||q.k==='lightChar',lampScale:1.4});
}
function render(){
  $('modes').innerHTML=MODES.map(([k,n])=>`<button aria-pressed="${Q.mode===k}" data-mode="${k}">${n}</button>`).join('');
  const st=$('stage'),pn=$('panel');
  if(Q.i>=Q.round.length){ // results
    const pct=Q.score/Q.round.length, b=Q.best[Q.mode]||0;
    if(Q.score>b){Q.best[Q.mode]=Q.score;try{localStorage.setItem('hu_best',JSON.stringify(Q.best))}catch(e){}}
    st.innerHTML=mapSVG({names:false});
    pn.innerHTML=`<div class="eyebrow">Round complete · ${MODES.find(m=>m[0]===Q.mode)[1]}</div>
    <div class="final"><span class="big">${Q.score}</span><span class="of">/ ${Q.round.length}</span></div>
    <p class="lead">${pct===1?'Clean sweep. Try another mode, or go again to see new questions.':pct>=.7?'Solid. Go again and the questions change.':pct>=.4?'Getting there. Another round will help it stick.':'Early days. Short rounds, often, is how this sticks.'}</p>
    <p class="counter">Best this device, this mode: ${Math.max(b,Q.score)} / ${PER_ROUND}</p>
    ${Q.missed.length?`<div class="eyebrow">To review</div><div class="missed">${Q.missed.map(m=>`<div><span>${m.q}</span><b>${m.a}</b></div>`).join('')}</div>`:''}
    <div class="btnrow"><button class="btn" data-act="new">New round</button></div>`;
    zoomUI();return;
  }
  const q=Q.round[Q.i];
  st.innerHTML=stageFor(q);
  const right=q.picked&&q.picked===q.ans;
  pn.innerHTML=`<div class="progress" aria-label="Question ${Q.i+1} of ${Q.round.length}">${Q.round.map((x,i)=>`<i class="${i<Q.i?(x.ok?'ok':'no'):i===Q.i?'cur':''}"></i>`).join('')}</div>
  <div class="counter">Question ${Q.i+1} of ${Q.round.length} · Score ${Q.score}</div>
  <h2>${q.prompt}</h2>${q.sub?`<p class="muted">${q.sub}</p>`:''}
  <div class="choices">${q.opts.map((o,i)=>`<button data-pick="${i}" class="${q.picked?(o===q.ans?'right':(o===q.picked?'wrong':'')):''}" ${q.picked?'disabled':''}><kbd>${i+1}</kbd>${o}</button>`).join('')}</div>
  ${q.picked?`<div class="feedback ${right?'good':'bad'}"><b>${right?'Correct.':'Not quite.'}</b> ${detail(q)}</div><div class="btnrow"><button class="btn" data-act="next">${Q.i===Q.round.length-1?'See results':'Next question'} →</button></div>`:''}
  <p class="foot muted">${q.k==='island'||q.k==='bay'?'Positions from BC Geographical Names.':'Characteristics from the CCG List of Lights, Howe Sound section.'}</p>`;
  zoomUI();
}
function detail(q){
  if(q.k==='island'||q.k==='bay') return `That's <b>${q.I.name}</b>.`;
  const L=q.L;
  return `<b>${L.n}</b> shows <span class="char" style="color:${hex(L.c)}">${L.ch}</span>.${L.id==='fin'?' <span class="flag">Some station material says every 4 s; the 2019 List of Lights says Q W 1s.</span>':''}`;
}
function choose(i){const q=Q.round[Q.i];if(!q||q.picked)return;q.picked=q.opts[i];q.ok=q.picked===q.ans;if(q.ok)Q.score++;else Q.missed.push({q:q.k==='island'||q.k==='bay'?q.prompt.replace('Name this ',''):q.k==='lightName'?'Light at this position':q.k==='flash'?'Flash pattern':q.L.n,a:q.k==='lightChar'||q.k==='flash'?`${q.L.ch} (${q.L.n})`:q.ans});render()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.mode){Q.mode=b.dataset.mode;try{localStorage.setItem('hu_mode',Q.mode)}catch(e){}return newRound()}
  if(b.dataset.pick!=null)return choose(+b.dataset.pick);
  if(b.dataset.act==='next'){Q.i++;S.zoom=null;return render()}
  if(b.dataset.act==='new')return newRound();
});
document.addEventListener('keydown',e=>{if(/^[1-4]$/.test(e.key))choose(+e.key-1);else if(e.key==='Enter'){const q=Q.round[Q.i];if(q&&q.picked){Q.i++;S.zoom=null;render()}else if(Q.i>=Q.round.length)newRound()}});
newRound();

</script>
